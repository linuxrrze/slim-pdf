[project]
name = "slim-pdf"
version = "0.1.0"
description = "A slim PDF tool: sign with real certificates (PAdES), check signatures, fill in forms, add text and images, edit pages"
requires-python = ">=3.11"
dependencies = [
    "pyhanko>=0.37,<0.38",
    "pyhanko-certvalidator>=0.32,<0.33",
    "pillow>=10",
    "platformdirs>=4",
    "tomli-w>=1.0",
    "certifi",
    "pypdf>=5",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pypdfium2>=4.30"]
pkcs11 = ["pyhanko[pkcs11]>=0.37,<0.38"]
keyring = ["keyring>=25"]
keepass = ["pykeepass>=4.1"]
all = ["slim-pdf[gui,pkcs11,keyring,keepass]"]
dev = ["slim-pdf[all]", "pytest>=8", "pytest-cov>=5", "cryptography>=42"]

[project.scripts]
slim-pdf = "slim_pdf.cli:main"
pdfsigner = "slim_pdf.cli:main"  # the old name, still working

[project.gui-scripts]
slim-pdf-gui = "slim_pdf.gui.app:main"
pdfsigner-gui = "slim_pdf.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"slim_pdf.gui" = ["icon.png", "icons/*.svg", "icons/LICENSE", "icons/README.md"]
"slim_pdf" = ["locale/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/test_gui_pages.py" = ["F811"]  # pytest fixtures imported from test_gui
"tests/test_gui_background.py" = ["F811"]
"tests/test_gui_forms.py" = ["F811"]
"tests/test_gui_insert.py" = ["F811"]
"tests/test_gui_tabs.py" = ["F811"]
"tests/test_gui_copy_pages.py" = ["F811"]
