name: installers

# Builds the Windows installer and the macOS disk images, smoke-tests the
# frozen apps, and attaches them to a GitHub release for tags v*.
# Code signing is optional; see packaging/README.md for the secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-15         # Apple Silicon
          - os: macos-15-intel   # Intel
    runs-on: ${{ matrix.os }}
    # Signing secrets live in the "release" environment, which only v* tags
    # may use (see packaging/README.md); other runs build unsigned.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    env:
      QT_QPA_PLATFORM: offscreen
      # secrets can't be used in `if:` directly
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_P12 != '' }}
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # Locked versions with hashes (packaging/release-requirements.txt),
        # then the app itself without resolving dependencies again.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r packaging/release-requirements.txt
          pip install --no-deps .
          pip check  # fails if the lock no longer satisfies pyproject.toml
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the version in pyproject.toml ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Icons
        run: python packaging/make_icons.py
      - name: Freeze
        run: pyinstaller packaging/slim-pdf.spec --noconfirm

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: python packaging/smoke_test.py "dist/Slim PDF/slim-pdf.exe" "dist/Slim PDF/Slim PDF.exe"
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: python packaging/smoke_test.py "dist/Slim PDF.app/Contents/MacOS/slim-pdf" "dist/Slim PDF.app/Contents/MacOS/slim-pdf-gui"

      # --- Windows ------------------------------------------------------------
      # With a certificate, Inno Setup signs both executables, the uninstaller
      # and the installer. The .pfx goes into the user's certificate store and
      # signtool picks it by thumbprint: no key file in the workspace, no
      # password on a command line.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WINDOWS_CERT_P12: ${{ secrets.WINDOWS_CERT_P12 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          $iscc = @("/DAppVersion=$env:VERSION")
          if ($env:HAS_WINDOWS_CERT -eq 'true') {
            $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_P12))
              $pw = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            } finally {
              Remove-Item $pfx -ErrorAction SilentlyContinue
            }
            "SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -Append $env:GITHUB_ENV
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
            $iscc += "/DSign"
            $iscc += "/Ssigntool=`"$signtool`" sign /sha1 $($cert.Thumbprint) /s My /fd sha256 /tr http://timestamp.digicert.com /td sha256 `$f"
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @iscc packaging\windows\slim-pdf.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove the signing certificate (Windows)
        if: always() && runner.os == 'Windows' && env.SIGNING_THUMBPRINT != ''
        shell: pwsh
        run: Remove-Item "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT" -DeleteKey -ErrorAction SilentlyContinue
      - name: Test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-Item dist\Slim-PDF-*-setup.exe).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=$env:RUNNER_TEMP\slim-pdf-inst"
          & "$env:RUNNER_TEMP\slim-pdf-inst\slim-pdf.exe" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\slim-pdf-inst\unins000.exe" -ArgumentList "/VERYSILENT"

      # --- macOS ----------------------------------------------------------------
      - name: Import signing certificate (optional)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/signing.p12"
          keychain="$RUNNER_TEMP/build.keychain-db"
          kc_password="$(openssl rand -hex 24)"
          trap 'rm -f "$p12"' EXIT
          echo "$MACOS_CERT_P12" | base64 --decode > "$p12"
          security create-keychain -p "$kc_password" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/build_dmg.sh "$VERSION"
      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS' && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true
      - name: Test the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls dist/Slim-PDF-*.dmg)
          hdiutil attach "$dmg" -mountpoint /Volumes/slim-pdf-test -nobrowse
          "/Volumes/slim-pdf-test/Slim PDF.app/Contents/MacOS/slim-pdf" --help
          hdiutil detach /Volumes/slim-pdf-test

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/Slim-PDF-*-setup.exe
            dist/Slim-PDF-*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
