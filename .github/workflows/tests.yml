name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # import a throwaway identity into the Windows store / macOS keychain
      PDFSIGNER_TEST_SYSTEM_STORE: ${{ matrix.os != 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages (Qt runtime, SoftHSM, KeePassXC)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 softhsm2 keepassxc
      - name: SoftHSM and KeePassXC (macOS)
        if: runner.os == 'macOS'
        run: brew install softhsm && brew install --cask keepassxc
      - name: KeePassXC (Windows)
        if: runner.os == 'Windows'
        run: choco install keepassxc -y --no-progress
      - run: pip install -e ".[dev]"
      # Fail instead of silently skipping the GUI tests if Qt can't load.
      - run: python -c "from PySide6 import QtWidgets"
      - run: pytest -q --cov=pdfsigner
